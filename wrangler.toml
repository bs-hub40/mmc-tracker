name = "logit-ai"
main = "worker/ai-proxy.js"
compatibility_date = "2026-09-07"

# Non-secret config only. Put the provider key on Cloudflare:
#   npx wrangler secret put AI_API_KEY
# Never commit keys, .dev.vars, or GitHub Action secrets for this.

[vars]
AI_PROVIDER = "gemini"
AI_MODEL = "gemini-3.6-flash"
ALLOWED_ORIGINS = "https://bs-hub40.github.io,http://127.0.0.1:5500,http://localhost:5500"
